<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>원광 캠퍼스 마당</title>
<meta name="description" content="학과마다 작은 집이 있는 원광디지털대학교 3D 캠퍼스. 수덕호 종이배, 중앙도서관, 광장 게시판을 함께 둘러봐요.">
<meta property="og:title" content="원광 캠퍼스 마당">
<meta property="og:description" content="학과 방을 둘러보고, 수덕호에서 종이배를 타고, 광장 게시판에 포스트잇을 붙여요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Hi+Melody&family=Nanum+Brush+Script&display=swap">
<style>
/* 레이아웃: 화면 전체가 3D 모형 캠퍼스(마당·학과 방·수덕호·중앙도서관). 솔잎색 안내판이 네 귀퉁이에 뜨고, 카드는 오른쪽(휴대폰은 아래)에서 올라온다. 하늘은 실제 시각을 따라 낮·노을·밤으로 바뀐다. */
:root{
  --sky:#cfe6ea;        /* 하늘·안개 */
  --sign:#21473a;       /* 캠퍼스 안내판 솔잎색 */
  --sign-ink:#f7f5ee;   /* 안내판 글자 */
  --sun:#f2c14e;        /* 주요 버튼 해바라기색 */
  --paper:#fbfaf6;      /* 카드 종이 */
  --ink:#1d2b26;        /* 카드 글자 */
  --mute:#5d6e67;       /* 보조 글자 */
  --line:#d9ddd3;
  --only:#c4472d;       /* 원광뿐 배지 */
  --display:'Bagel Fat One','Nanum Gothic',system-ui,sans-serif;
  --pen:'Nanum Pen Script','Nanum Gothic',cursive;
  --body:'Nanum Gothic',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100dvh;margin:0;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;touch-action:none}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:pointer}
button,a.btn{font-family:var(--body);font-weight:800;font-size:15px;border:0;cursor:pointer;text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.sign{background:var(--sign);color:var(--sign-ink);border-radius:6px;box-shadow:0 3px 0 #0f2a21,0 8px 18px rgba(20,40,30,.25)}
#place{position:fixed;top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:10px 14px 11px;max-width:min(58vw,340px);pointer-events:none}
#place small{display:block;font-size:11px;letter-spacing:.12em;opacity:.75}
#place b{display:block;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.2;margin-top:2px}
#place .who{display:block;font-size:12px;margin-top:5px;opacity:.85}
#tools{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:50vw}
#tools button{padding:9px 12px;font-size:13px}
#tools .sun{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 #b88a1d}

#bar{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:8px;flex-wrap:wrap;pointer-events:none}
#bar button{pointer-events:auto;padding:11px 15px}
#bar .leave,#bar .hot{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 #b88a1d}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 60px);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(92vw,540px);z-index:3}
.pop button{background:var(--paper);color:var(--ink);padding:9px 12px;border-radius:999px;box-shadow:0 2px 0 var(--line)}
.pop button[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink)}

#hint{position:fixed;left:50%;top:calc(max(12px,env(safe-area-inset-top,0px)) + 84px);transform:translateX(-50%);background:rgba(251,250,246,.94);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;pointer-events:none;transition:opacity .4s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#tour{position:fixed;left:50%;top:calc(max(12px,env(safe-area-inset-top,0px)) + 82px);transform:translateX(-50%);width:min(520px,calc(100vw - 24px));background:var(--paper);border-radius:10px;padding:12px 16px 13px;box-shadow:0 10px 30px rgba(20,40,30,.25);pointer-events:none;z-index:4}
#tour small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#2f6d8f}
#tour p{margin:4px 0 0;font-size:15px;font-weight:700;line-height:1.55}

#panel{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 24px));background:var(--paper);border-radius:10px;box-shadow:0 18px 50px rgba(20,40,30,.3);display:flex;flex-direction:column;overflow:hidden;z-index:5}
#panel header{background:var(--sign);color:var(--sign-ink);padding:16px 18px 14px;position:relative}
#panel header small{font-size:12px;letter-spacing:.06em;opacity:.8}
#panel h2{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.25;margin:6px 40px 0 0;text-wrap:balance}
#panel .x{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.14);color:var(--sign-ink);width:36px;height:36px;border-radius:50%;font-size:18px}
#pbody{padding:16px 18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.badge{align-self:flex-start;font-size:12px;font-weight:800;padding:4px 9px;border-radius:4px;background:#e8efe9;color:var(--sign)}
.badge.only{background:var(--only);color:#fff}
.slogan{font-size:17px;font-weight:800;line-height:1.5;margin:0}
dl{margin:0;display:grid;gap:12px}
dt{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.06em}
dd{margin:3px 0 0;line-height:1.65}
dd.hl{background:#fff6dc;border-radius:6px;padding:8px 10px;margin-top:5px}
.floors{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;background:#eef2ee;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5}
.floors b{color:var(--sign);font-variant-numeric:tabular-nums}
.btns{display:grid;gap:8px}
.btn{display:block;text-align:center;padding:13px 14px;border-radius:8px;background:var(--sign);color:var(--sign-ink)!important}
.btn.sun{background:var(--sun);color:var(--ink)!important;box-shadow:0 3px 0 #b88a1d}
.btn.line{background:transparent;color:var(--sign)!important;box-shadow:inset 0 0 0 2px var(--sign)}
.btn small{display:block;font-weight:400;font-size:12px;margin-top:3px;opacity:.85}
.btn.closed{background:#7d8b85}
.sched{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;background:#eef2ee;border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mute);line-height:1.6;margin:0}
.tel{font-size:22px;font-weight:800;letter-spacing:.02em;user-select:all}
.rlist{display:grid;gap:14px}
.rlist h3{margin:0 0 6px;font-size:13px;color:var(--mute);letter-spacing:.06em}
.rlist .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rlist button{background:#eef2ee;color:var(--ink);text-align:left;padding:10px 10px;border-radius:6px;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0}
.rlist button i{width:10px;height:10px;border-radius:2px;flex:none}
.rlist button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist button em{margin-left:auto;font-style:normal;color:var(--sign);font-size:12px}
.prog{font-size:13px;font-weight:800;color:var(--sign)}

.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pn{position:relative;color:#1d2b26;padding:14px 10px 8px;min-height:92px;box-shadow:2px 3px 0 rgba(60,40,20,.18);font-size:14px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.pn:nth-child(odd){transform:rotate(-1.2deg)} .pn:nth-child(even){transform:rotate(1deg)}
.pn p{margin:0;font-family:var(--pen);font-size:23px;line-height:1.2;font-weight:400;overflow-wrap:anywhere}
.pn small{display:block;margin-top:6px;color:#5d6e67;font-family:var(--pen);font-size:18px}
.pn button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.12);font-size:12px}
#noteText{width:100%;box-sizing:border-box;font:400 24px/1.25 var(--pen);padding:10px 12px;border:2px solid var(--line);border-radius:8px;margin-top:6px;background:#fff;color:var(--ink);resize:none}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:10.5px;font-weight:800;line-height:1.2;color:#a9b3ad;padding:3px;word-break:keep-all;overflow:hidden}
.st.on{border:3px solid var(--c);color:var(--c);background:#fff;transform:rotate(-7deg)}
.coupon{display:grid;gap:4px;background:#1b2140;color:#fff;border-radius:10px;padding:14px 16px;border:2px dashed #f2c14e}
.coupon b{font-family:var(--display);font-weight:400;font-size:20px;color:#ffd76a}
.coupon span{font-size:13px;opacity:.9}
#tools .sun{font-weight:800}
#start{position:fixed;inset:0;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(207,230,234,.35),rgba(207,230,234,.8));z-index:10;overflow:auto;touch-action:pan-y}
#start .card{width:min(460px,100%);background:var(--paper);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(20,40,30,.3)}
#start .top{background:var(--sign);color:var(--sign-ink);padding:20px 22px 16px}
#start .top small{font-size:12px;letter-spacing:.14em;opacity:.8}
#start h1{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.1;margin:8px 0 10px}
#start .top p{margin:0;line-height:1.6;font-size:15px}
#prev{display:block;width:100%;height:190px;background:linear-gradient(#e3f1f3,#cfe6ea)}
#start .form{padding:14px 22px 22px;display:grid;gap:12px}
#start label,.lbl{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.06em}
#nick{width:100%;box-sizing:border-box;font:700 17px var(--body);padding:11px 12px;border:2px solid var(--line);border-radius:8px;margin-top:6px;background:#fff;color:var(--ink)}
.swatch{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.swatch button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.7)}
.swatch button[aria-pressed="true"]{outline:3px solid var(--sign);outline-offset:2px}
.chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.chips button{background:#eef2ee;color:var(--ink);padding:7px 11px;border-radius:999px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink)}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
#enter{padding:15px;font-size:17px}

@media (max-width:640px){
  #panel{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;max-height:72%;bottom:max(8px,env(safe-area-inset-bottom,0px))}
  #place b{font-size:17px}
  #tools{max-width:46vw}
  #tools button{padding:7px 9px;font-size:12px}
  #bar{gap:6px}
  #bar button{padding:9px 11px;font-size:13px}
  #hint{top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 104px)}
  #tour{top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 104px)}
  .pop{bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 100px)}
}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="원광 캠퍼스 3D 화면. 바닥을 누르면 그쪽으로 걸어가요."></canvas>

<div id="place" class="sign" aria-live="polite"><small>원광디지털대학교</small><b id="placeName">캠퍼스 마당</b><span class="who" id="who">이웃들과 천천히 둘러보세요</span></div>
<div id="tools">
  <button class="sign" id="timeBtn" type="button">🕰 자동</button>
  <button class="sign" id="snd" type="button" aria-pressed="true">♪ 소리 끄기</button>
  <button class="sign" id="stampBtn" type="button">🎫 0/17</button>
  <button class="sign" id="lookBtn" type="button">내 모습</button>
  <button class="sign" id="listBtn" type="button">갈 곳 목록</button>
  <button class="sun" id="callBtn" type="button">상담</button>
</div>
<div id="hint">바닥을 누르면 걸어가요.</div>
<div id="tour" hidden><small>종이배 유람</small><p id="tourText"></p></div>
<div id="emo" class="pop" hidden></div>
<div id="faces" class="pop" hidden></div>
<div id="bar">
  <button class="sign" id="bowBtn" type="button">🙇 인사</button>
  <button class="sign" id="sitBtn" type="button">🪑 앉기</button>
  <button class="sign" id="faceBtn" type="button" aria-expanded="false">🙂 표정</button>
  <button class="sign" id="emoBtn" type="button" aria-expanded="false">💬 말풍선</button>
  <button class="hot" id="treatBtn" type="button" hidden>🦴 간식 주기</button>
  <button class="hot" id="boatBtn" type="button" hidden>⛵ 종이배 타기</button>
  <button class="leave" id="leaveBtn" type="button" hidden>캠퍼스로 나가기</button>
</div>

<aside id="panel" hidden aria-live="polite">
  <header><small id="pk"></small><h2 id="ph"></h2><button class="x" id="px" type="button" aria-label="닫기">✕</button></header>
  <div id="pbody"></div>
</aside>

<div id="start">
  <div class="card">
    <div class="top">
      <small>원광디지털대학교 · 17개 학과</small>
      <h1>원광 캠퍼스 마당</h1>
      <p>학과마다 작은 집이 있고, 마당 밖으로 나가면 수덕호와 중앙도서관이 있어요. 종이배도 타 보세요.</p>
    </div>
    <canvas id="prev" aria-label="내 캐릭터 미리 보기"></canvas>
    <div class="form">
      <div><label for="nick">마당에서 쓸 이름</label><input id="nick" maxlength="10" autocomplete="off"></div>
      <div id="custom"></div>
      <div class="row2"><button class="btn line" id="dice" type="button">🎲 아무거나</button><button class="btn sun" id="enter" type="button">마당으로 들어가기</button></div>
      <p class="note">마당과 방에는 산책하고 쉬어 가는 이웃들이 있어요. 같은 시간에 이 페이지를 연 분은 이름표를 달고 함께 보여요. 글로 대화하는 기능은 없어요.</p>
    </div>
  </div>
</div>

<script src="config.js"></script>

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), ground=new THREE.Plane(new THREE.Vector3(0,1,0),0), hit=new THREE.Vector3();

function setNdc(e){ const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ndc,camera); }
function pickThing(){ const sc=scenes[place]; const list=clickables.filter(c=>{ let o=c.obj; while(o.parent) o=o.parent; return o===sc&&c.obj.visible; });
  const hits=ray.intersectObjects(list.map(c=>c.obj),true); if(!hits.length) return null;
  let o=hits[0].object; while(o){ const c=list.find(c=>c.obj===o); if(c) return c; o=o.parent; } return null; }
function groundAt(){ return ray.ray.intersectPlane(ground,hit)?hit.clone():null; }

  if(t.type==='host'){ hostCard(); markSeen(t.obj); return; }
  if(t.type==='npc'){ deptCard(BYK[t.k]); markSeen(t.obj); giveStamp(t.k); return; }

  if(t.type==='animal'){ petAnimal(t.a); return; }
  if(t.type==='ferry'){ lakeCard(); markSeen(t.obj); return; }
  if(t.type==='pavilion'){ lakeCard(); return; }
  if(t.type==='boat'){ if(Math.hypot(myPos.x,myPos.z-9.9)>3){ target.set(0,0,10.2); pending={ride:1}; hint('선착장으로 걸어가요.'); } else startRide(); return; }

const keys=new Set();
addEventListener('keydown',e=>{ if(!started||/INPUT|TEXTAREA/.test(e.target.tagName)) return; const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys.add(k); e.preventDefault(); } if(k==='escape'){ hideP(); closePops(); } });

function resolve(v){ if(place==='campus'){ const l=Math.hypot(v.x,v.z); if(l>38){ v.x*=38/l; v.z*=38/l; } }
  else if(place==='lake'){ v.x=Math.max(-26,Math.min(26,v.x)); v.z=Math.max(-19.2,Math.min(21,v.z)); }
  else if(place==='library'){ v.x=Math.max(-13.4,Math.min(13.4,v.x)); v.z=Math.max(-9.4,Math.min(9.8,v.z)); }
  else { v.x=Math.max(-5.9,Math.min(5.9,v.x)); v.z=Math.max(-4.4,Math.min(4.6,v.z)); }
  pushOut(v,place,0); }

const camAt=new THREE.Vector3(); let camSnap=true;
function placeCam(dt){ let want, off; const port=innerWidth<innerHeight;
  let lookY=.7, lookZ=0;
  if(fw&&!ride){ want=myPos.clone(); off=new THREE.Vector3(0,3,16).multiplyScalar(port?1.25:1); lookY=6.5; lookZ=-10; }
  else if(ride){ want=myPos.clone(); off=new THREE.Vector3(0,7.5,12).multiplyScalar(port?1.35:1); if(fw){ off.set(0,3.5,14); lookY=6; lookZ=-10; } }
  else if(place==='campus'||place==='lake'){ want=myPos.clone(); off=new THREE.Vector3(0,10,14.5).multiplyScalar(zoom*(port?1.45:1)); }
  else if(place==='library'){ want=V(myPos.x*.6,-1+myPos.z*.5); off=new THREE.Vector3(0,10.5,14).multiplyScalar(Math.min(zoom,1.3)*(port?1.4:1)); }
  else { want=V(myPos.x*.35,-0.6+myPos.z*.2); off=new THREE.Vector3(0,9,12.8).multiplyScalar(Math.min(zoom,1.25)*(port?1.15:1)); }
  if(camSnap){ camAt.copy(want); camSnap=false; } else camAt.lerp(want,Math.min(1,dt*4));
  camera.position.copy(camAt).add(off); camera.lookAt(camAt.x,camAt.y+lookY,camAt.z+lookZ);
  const sun=scenes[place].userData.sun; sun.position.set(camAt.x+10,24,camAt.z+8); sun.target.position.copy(camAt); }
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<h?52:40; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

/* ---------- 매 장면 ---------- */
let last=performance.now(), started=false, tAll=0, minuteT=0;
function animAvatar(av,moving,sit,t,phase,sitY=-.18){ const b=av.userData.body; if(!b) return;
  let y=0, rx=0; if(moving&&!REDUCE) y=Math.abs(Math.sin(t*10+phase))*.1;
  if(sit) y=sitY;
  const bt=av.userData.bowT; if(bt){ const k=(performance.now()-bt)/900; if(k<1) rx=Math.sin(k*Math.PI)*.5; else av.userData.bowT=0; }
  b.position.y+=(y-b.position.y)*.35; b.rotation.x=rx;
  const arms=av.userData.arms; if(arms){ const sw=moving&&!REDUCE?Math.sin(t*10+phase)*.55:sit?-.5:0; arms[0].rotation.x=sw; arms[1].rotation.x=sit?-.5:-sw; }
  if(av.userData.bub&&performance.now()>av.userData.bubT){ av.remove(av.userData.bub); av.userData.bub=null; } }
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; tAll+=dt;
  if(started){
    if(ride) stepRide(dt,tAll);
    else {
      if(keys.size){ const v=V((keys.has('d')||keys.has('arrowright'))-(keys.has('a')||keys.has('arrowleft')),(keys.has('s')||keys.has('arrowdown'))-(keys.has('w')||keys.has('arrowup')));
        if(v.lengthSq()){ v.normalize().multiplyScalar(1.2); target.copy(myPos).add(v); pending=null; if(act==='sit'){ act=''; $('sitBtn').textContent='🪑 앉기'; } } }
      const d=new THREE.Vector3().subVectors(target,myPos); d.y=0; const dist=d.length(); let moving=false;
      if(dist>.05&&act!=='sit'){ const sp=Math.min(dist,dt*(place==='campus'||place==='lake'?6.2:4.4)); d.normalize(); myPos.addScaledVector(d,sp); resolve(myPos); moving=true;
        const want=Math.atan2(d.x,d.z); let diff=want-my.rotation.y; diff=Math.atan2(Math.sin(diff),Math.cos(diff)); my.rotation.y+=diff*Math.min(1,dt*10);
        if(dist<.3) target.copy(myPos); sendPresence(); }
      my.position.copy(myPos); animAvatar(my,moving,act==='sit',tAll,0);
      if(cool&&Math.hypot(myPos.x-spawnAt.x,myPos.z-spawnAt.z)>2.4) cool=false;
      if(!cool) for(const e of EXITS[place]||[]){ if(Math.hypot(myPos.x-e.x,myPos.z-e.z)<e.r&&(!press||pending)){ go(e.to,e.pos,e.ry); break; } }
      if(pending&&pending.ride&&place==='lake'&&Math.hypot(myPos.x,myPos.z-10.2)<1.2){ pending=null; startRide(); }
      $('boatBtn').hidden=!(place==='lake'&&Math.hypot(myPos.x,myPos.z-9.9)<3.2);
    }
    if(ride){ animAvatar(my,false,true,tAll,0,-.15); $('boatBtn').hidden=false; }
    const na=ride?null:nearAnimal(); $('treatBtn').hidden=!na; if(na) $('treatBtn').textContent={cat:'🐟',dog:'🦴',rabbit:'🥕'}[na.kind]+' 간식 주기';
    if(faceHold>0&&(faceHold-=dt)<=0&&!ride) setFace(my,me.f);
    for(const e of peers.values()){ if(!e.q||!e.av.parent) continue; const p=e.av.position, dx=e.q.x-p.x, dz=e.q.z-p.z, l=Math.hypot(dx,dz);
      if(l>(WEB?90:6)) p.set(e.q.x,0,e.q.z); else if(l>.001){ const st=Math.min(l,dt*7); p.x+=dx/l*st; p.z+=dz/l*st; }
      if(l>.05&&!e.q.b) e.av.rotation.y=Math.atan2(dx,dz); else e.av.rotation.y=e.q.ry;
      e.av.visible=e.q.r===place; animAvatar(e.av,l>.08&&!e.q.b,e.q.a==='sit'||e.q.b,tAll,1.3,e.q.b?-.12:-.18); }
    stepWalkers(dt); stepAnimals(dt,tAll); if(fw) stepFw(dt); if(place==='lake') stepBoats(dt,tAll);
    for(let i=hearts.length-1;i>=0;i--){ const h=hearts[i]; h.t+=dt; h.h.position.y+=dt*1.1; h.h.material.opacity=1-h.t/h.d; if(h.t>=h.d){ h.h.parent.remove(h.h); hearts.splice(i,1); } }
    for(const m of marks) if(!REDUCE&&!m.userData.seen) m.position.y=m.userData.base+Math.sin(tAll*2.4)*.08;
    if((minuteT+=dt)>60){ minuteT=0; applyTime(); }
  }
  placeCam(dt); renderer.render(scenes[place],camera);
  if(!$('start').hidden) drawPreview(tAll);
  requestAnimationFrame(loop); }

/* ---------- 소리: 파일 없이 코드로. 가야금처럼 튕기는 느린 5음 음악 ---------- */
const Sound=(()=>{ let ac=null,out,on=true,step=0,next=0;
  const hz=m=>440*2**((m-69)/12);
  const MEL=[62,0,65,67,0,69,0,67, 65,0,62,0,60,0,0,0, 62,0,67,0,69,72,0,69, 67,0,65,0,62,0,0,0];
  const BAS=[38,0,0,0,45,0,0,0, 41,0,0,0,36,0,0,0, 38,0,0,0,43,0,0,0, 41,0,0,0,38,0,0,0];
  function init(){ if(ac) return true; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; return false; }
    out=ac.createGain(); out.gain.value=on?1:0; out.connect(ac.destination); next=ac.currentTime+.1; setInterval(tick,60); return true; }
  function pluck(m,t,len,v){ const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter(); o.type='triangle'; o2.type='sine';
    o.frequency.setValueAtTime(hz(m)*1.01,t); o.frequency.exponentialRampToValueAtTime(hz(m),t+.08); o2.frequency.value=hz(m)*2;
    f.type='lowpass'; f.frequency.setValueAtTime(3200,t); f.frequency.exponentialRampToValueAtTime(600,t+len);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+len);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(out); o.start(t); o2.start(t); o.stop(t+len+.05); o2.stop(t+len+.05); }
  function tick(){ if(ac.state!=='running') return; const s=60/72/2; if(next<ac.currentTime) next=ac.currentTime+.05;
    const night=phase()==='night';
    while(next<ac.currentTime+.25){ const i=step++%MEL.length; if(MEL[i]) pluck(MEL[i]-(night?2:0),next,s*3.2,night?.05:.07); if(BAS[i]) pluck(BAS[i]-(night?2:0),next,s*6,.06); next+=s; } }
  return { get on(){ return on; }, start(){ if(on) init(); if(ac&&ac.state==='suspended') ac.resume().catch(()=>{}); },
    set(v){ on=v; if(v) init(); if(out) out.gain.value=v?1:0; },
    pause(p){ if(ac){ const r=p?ac.suspend():ac.resume(); if(r&&r.catch) r.catch(()=>{}); } },
    chime(){ if(!on||!ac) return; const t=ac.currentTime; pluck(79,t,1.2,.06); pluck(84,t+.12,1.4,.05); },
    boom(){ if(!on||!ac) return; const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(38,t+.5);
      g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+.7); o.connect(g); g.connect(out); o.start(t); o.stop(t+.75); pluck(94+(Math.random()*10|0),t+.06,.5,.022); },
    pet(){ if(!on||!ac) return; const t=ac.currentTime; pluck(84,t,.4,.05); pluck(88,t+.09,.4,.05); pluck(91,t+.18,.6,.05); } };
})();
document.addEventListener('visibilitychange',()=>Sound.pause(document.hidden));
$('snd').onclick=()=>{ Sound.set(!Sound.on); $('snd').textContent=Sound.on?'♪ 소리 끄기':'♪ 소리 켜기'; $('snd').setAttribute('aria-pressed',Sound.on); };

/* ---------- 시작 화면과 꾸미기 ---------- */
const prevR=new THREE.WebGLRenderer({canvas:$('prev'),antialias:true,alpha:true}); prevR.setPixelRatio(Math.min(devicePixelRatio,2));
const prevS=new THREE.Scene(); prevS.add(new THREE.HemisphereLight(0xffffff,0x8a9a80,.75)); const pl=new THREE.DirectionalLight(0xffffff,.55); pl.position.set(2,4,5); prevS.add(pl);
const prevC=new THREE.PerspectiveCamera(30,2,.1,50); prevC.position.set(0,1.45,4.6); prevC.lookAt(0,1.05,0);
let prevAv=null;
function preview(){ if(prevAv) prevS.remove(prevAv); prevAv=person(me.L,me.f); prevS.add(prevAv); }
function drawPreview(t){ const cv=$('prev'), w=cv.clientWidth, h=cv.clientHeight; if(!w) return; if(cv.width!==Math.round(w*prevR.getPixelRatio())){ prevR.setSize(w,h,false); prevC.aspect=w/h; prevC.updateProjectionMatrix(); }
  if(prevAv) prevAv.rotation.y=REDUCE?0:Math.sin(t*.8)*.6; prevR.render(prevS,prevC); }
function drawCustom(){ const L=me.L, human=L.sp==='human';
  const sw=(lbl,key,arr)=>`<div><span class="lbl">${lbl}</span><div class="swatch">${arr.map((c,i)=>`<button type="button" style="background:${hexColor(c)}" aria-label="${lbl} ${i+1}" aria-pressed="${L[key]===i}" data-k="${key}" data-v="${i}"></button>`).join('')}</div></div>`;
  const ch=(lbl,key,arr)=>`<div><span class="lbl">${lbl}</span><div class="chips">${arr.map(([k,t])=>`<button type="button" aria-pressed="${L[key]===k}" data-k="${key}" data-s="${k}">${t}</button>`).join('')}</div></div>`;
  $('custom').innerHTML=`<div style="display:grid;gap:10px">${ch('누구로 갈까요','sp',SPECIES)}${sw(human?'피부':'털 색','sk',human?SKINS:FUR[L.sp])}${human?ch('머리 모양','hs',HAIRS)+sw('머리 색','hc',HAIRC):''}${ch('옷','o',OUTFITS)}${sw('옷 색','oc',OCOL)}${ch('모자','h',HATS)}${ch('소품','a',ACCS)}
   <div><span class="lbl">표정</span><div class="chips">${FACES.map(([k,t])=>`<button type="button" aria-pressed="${me.f===k}" data-f="${k}">${t}</button>`).join('')}</div></div></div>`;
  $('custom').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; me.L[k]=b.dataset.s!==undefined?b.dataset.s:+b.dataset.v; drawCustom(); preview(); });
  $('custom').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ me.f=b.dataset.f; drawCustom(); preview(); }); }
$('nick').value=me.n;
$('dice').onclick=()=>{ me.L=randomLook(); me.f=pick(FKEYS); drawCustom(); preview(); };
$('lookBtn').onclick=()=>{ $('enter').textContent='이대로 할게요'; drawCustom(); preview(); $('start').hidden=false; hideP(); };
$('enter').onclick=()=>{ me.n=clean($('nick').value)||me.n; store.set('me2',me); const keep=myPos.clone(); makeMe(); myPos.copy(keep); if(ride){ const b=ride.boat; b.add(my); my.position.set(-.45,.12,0); my.rotation.set(0,Math.PI/2,0); }
  $('start').hidden=true; Sound.start(); if(!started){ started=true; camSnap=true; hint('바닥을 누르면 걸어가요. 집 문 앞에 서면 학과 방으로 들어가요.'); connectRoom(); connectBoard(); } sendPresence(true); };
addEventListener('pointerdown',()=>{ if(started) Sound.start(); });

const fontsReady=document.fonts?Promise.all([document.fonts.load('400 40px "Bagel Fat One"'),document.fonts.load('800 40px "Nanum Gothic"'),document.fonts.load('400 34px "Nanum Pen Script"','가나다')]).catch(()=>{}):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,1500))]).then(()=>{ buildCampus(); spawnCampusWalkers(); makeMe(); drawCustom(); preview(); updStamp(); applyTime(); requestAnimationFrame(loop); if(document.fonts) NFONT.forEach(o=>document.fonts.load('400 30px '+o.f,'가나다').then(drawBoard).catch(()=>{})); });
</script>
