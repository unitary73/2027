<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사이버대 발전계획 비교</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="사이버대학교 중장기발전계획을 엑셀 양식·원문(PDF·DOCX·TXT)으로 수합하고 비전·전략과제·영역 비중·성과지표·키워드를 비교 분석합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 왼쪽 세로 메뉴(좁으면 위쪽 가로 탭) + 오른쪽 작업 영역. 결재 문서처럼 차분한 표 중심 화면 */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --ink:#15232a; --muted:#5a6b72; --line:#dbe3e5; --line-strong:#b9c7cb;
  --accent:#0d6468; --accent-ink:#ffffff; --accent-soft:#e0efee; --home:#b5541b; --home-soft:#fbeee4;
  --pos:#257de0; --neg:#dc3c3d; --zero:#c9d2d5; --cur:#a9b6bb; --tgt:#257de0;
  --warn-bg:#fff4dc; --warn-ink:#7a5200; --ok-ink:#006c10;
  --h0:#f1f4f5; --h1:#cce3fd; --h2:#9dc8f7; --h3:#6aabf1; --h4:#338ced; --h5:#2370cd; --h6:#1757ac; --h7:#0e3d7e;
  --hi0:#5a6b72; --hi1:#15232a; --hi2:#15232a; --hi3:#15232a; --hi4:#ffffff; --hi5:#ffffff; --hi6:#ffffff; --hi7:#ffffff;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --surface:#162125; --ink:#e4ecee; --muted:#93a5ab; --line:#25343a; --line-strong:#38494f;
  --accent:#55b6b7; --accent-ink:#06282a; --accent-soft:#163a3b; --home:#f0904f; --home-soft:#3a2416;
  --pos:#338ced; --neg:#eb6263; --zero:#3a4a50; --cur:#55666c; --tgt:#338ced;
  --warn-bg:#3a2d0c; --warn-ink:#f5cf7a; --ok-ink:#5fd06f;
  --h0:#1b282c; --h1:#17304a; --h2:#173f6e; --h3:#1757ac; --h4:#1b64be; --h5:#2370cd; --h6:#338ced; --h7:#6aabf1;
  --hi0:#93a5ab; --hi1:#e4ecee; --hi2:#e4ecee; --hi3:#ffffff; --hi4:#ffffff; --hi5:#ffffff; --hi6:#ffffff; --hi7:#0b1a2a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --surface:#162125; --ink:#e4ecee; --muted:#93a5ab; --line:#25343a; --line-strong:#38494f;
  --accent:#55b6b7; --accent-ink:#06282a; --accent-soft:#163a3b; --home:#f0904f; --home-soft:#3a2416;
  --pos:#338ced; --neg:#eb6263; --zero:#3a4a50; --cur:#55666c; --tgt:#338ced;
  --warn-bg:#3a2d0c; --warn-ink:#f5cf7a; --ok-ink:#5fd06f;
  --h0:#1b282c; --h1:#17304a; --h2:#173f6e; --h3:#1757ac; --h4:#1b64be; --h5:#2370cd; --h6:#338ced; --h7:#6aabf1;
  --hi0:#93a5ab; --hi1:#e4ecee; --hi2:#e4ecee; --hi3:#ffffff; --hi4:#ffffff; --hi5:#ffffff; --hi6:#ffffff; --hi7:#0b1a2a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;margin:0}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.15rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.85em}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-size:.72rem;letter-spacing:.08em;color:var(--accent);font-weight:600}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:var(--r);color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--accent-soft)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav a .cnt{font-size:.75rem;opacity:.8}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
main{padding-block:24px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.page-head p{color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.panel-head p{color:var(--muted);font-size:.85rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:.8rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:3px 8px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:.8rem;border:1px solid transparent}
.chip.home{background:var(--home-soft);color:var(--home);font-weight:600}
.chip.ex{background:var(--warn-bg);color:var(--warn-ink)}
.chip.line{background:transparent;border-color:var(--line-strong)}
.chip button{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:inherit}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;padding:4px 10px;border:1px solid var(--line-strong);border-radius:999px;font-size:.85rem}
label.chk:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span{font-size:.8rem;color:var(--muted);font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.form-grid .w2{grid-column:span 2}.form-grid .w4{grid-column:1/-1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:600;font-size:.8rem;color:var(--muted);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.cmp th:first-child,.cmp td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:110px;font-weight:600;color:var(--muted)}
.cmp th:first-child{background:var(--bg);z-index:2}
.cmp td{min-width:220px}
.cmp ul{margin:0;padding-left:18px}
.cmp th.homecol{color:var(--home)}
.edit td{padding:4px 6px}
.edit input,.edit select{padding:4px 7px}
.list-uni{display:flex;flex-direction:column;gap:6px}
.uni-item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.uni-item[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.uni-item .meta{font-size:.78rem;color:var(--muted)}
.plans{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:3px}
/* heatmap */
.heat{display:grid;gap:2px;min-width:560px}
.heat .hc{padding:8px 6px;text-align:center;font-variant-numeric:tabular-nums;font-size:.84rem;border-radius:3px;cursor:default;font-weight:500}
.heat .hh{font-size:.78rem;color:var(--muted);font-weight:600;padding:6px 4px;text-align:center;display:flex;align-items:flex-end;justify-content:center;line-height:1.25}
.heat .hr{font-size:.85rem;font-weight:600;padding:8px 8px 8px 0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.h0{background:var(--h0);color:var(--hi0)}.h1{background:var(--h1);color:var(--hi1)}.h2{background:var(--h2);color:var(--hi2)}.h3{background:var(--h3);color:var(--hi3)}
.h4{background:var(--h4);color:var(--hi4)}.h5{background:var(--h5);color:var(--hi5)}.h6{background:var(--h6);color:var(--hi6)}.h7{background:var(--h7);color:var(--hi7)}
.ramp{display:flex;gap:2px;align-items:center}.ramp span{width:22px;height:10px;border-radius:2px}
/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:10px;align-items:center}
.bar-row .nm{font-weight:600;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .vals{font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar-row .vals b{color:var(--ink)}
.track{position:relative;height:30px;border-left:1px solid var(--line-strong)}
.track .b{position:absolute;left:0;height:12px;border-radius:0 4px 4px 0}
.track .b.cur{top:2px;background:var(--cur)}
.track .b.tgt{top:16px;background:var(--tgt)}
.track .grid{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.axis{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:10px;font-size:.75rem;color:var(--muted)}
.axis .ticks{position:relative;height:16px}.axis .ticks span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}
/* diverging */
.div-row{display:grid;grid-template-columns:130px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.86rem}
.div-track{position:relative;height:18px}
.div-track .mid{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--line-strong)}
.div-track .b{position:absolute;top:3px;height:12px}
.div-track .b.p{background:var(--pos);border-radius:0 4px 4px 0}
.div-track .b.n{background:var(--neg);border-radius:4px 0 0 4px}
.div-row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.insights{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.insights li::marker{color:var(--accent)}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw .k{display:inline-flex;gap:6px;align-items:baseline;padding:3px 9px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line)}
.kw .k b{font-weight:600}.kw .k span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.kwbar{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:.86rem}
.kwbar .t{height:10px;background:var(--h4);border-radius:0 4px 4px 0}
.uni-kw{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.uni-kw > div{display:flex;flex-direction:column;gap:8px;min-width:0}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:10px 12px;font-size:.85rem}
.cand{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:8px}
.cand label{display:flex;gap:8px;align-items:flex-start;padding:3px 4px;border-radius:4px;font-size:.88rem}
.cand label:hover{background:var(--bg)}
.cand .d{margin-left:auto;font-size:.75rem;color:var(--muted);white-space:nowrap}
.domain-tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.domain-tasks ul{margin:4px 0 0;padding-left:18px;font-size:.86rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:var(--r);font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}
#tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px;font-size:.82rem;box-shadow:0 4px 16px rgba(0,0,0,.16);z-index:60;max-width:280px;display:flex;flex-direction:column;gap:2px}
#tip strong{font-size:.95rem;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px;padding-block:12px}
  nav{flex-direction:row;overflow-x:auto;gap:4px}
  nav a{white-space:nowrap;padding:6px 10px}
  nav a .cnt{display:none}
  .side-foot{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
  .plans{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar-row,.axis{grid-template-columns:90px minmax(0,1fr) 92px}
  .div-row{grid-template-columns:96px minmax(0,1fr) 56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="eyebrow">기획처 · 대학발전계획</span>
      <h1>사이버대 발전계획 비교</h1>
    </div>
    <nav id="nav" aria-label="화면"></nav>
    <div class="side-foot">
      <span id="saveState">이 브라우저에 자동 저장됩니다.</span>
      <span>자료는 서버로 보내지 않습니다.</span>
    </div>
  </aside>
  <main id="main" aria-live="polite"></main>
</div>
<div id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
/* ───────────── 기준 정보 ───────────── */
const DOMAINS=[
  {k:'edu',  n:'교육혁신',        kw:['교육과정','교과','강의','수업','콘텐츠','교수법','교수학습','마이크로디그리','전공','학위','이러닝','플립','교육혁신','교육품질','학사','융합','교육모델','커리큘럼','학습분석','에듀테크','트랙','나노디그리','모듈']},
  {k:'stu',  n:'학생성공·지원',   kw:['학생','상담','진로','취업','장학','중도탈락','학습지원','튜터','만족도','비교과','커뮤니티','동문','경력','재학생','신입생','충원','학습자','멘토','학생성공','성장','케어']},
  {k:'res',  n:'연구·산학협력',   kw:['연구','산학','기업','협약','특허','기술이전','산업체','현장실습','프로젝트','연구소','R&D','산업','협력','일자리','창업','캡스톤']},
  {k:'dx',   n:'디지털·인프라',   kw:['AI','인공지능','데이터','플랫폼','시스템','LMS','클라우드','메타버스','스튜디오','인프라','보안','디지털전환','DX','스마트','가상','모바일','앱','빅데이터','XR','챗봇','생성형','전산','네트워크','캠퍼스']},
  {k:'glo',  n:'국제화',          kw:['국제','글로벌','해외','외국인','유학생','다국어','재외동포','교류','한국어','K-','세계','다문화']},
  {k:'life', n:'평생교육·사회공헌',kw:['평생','지역','사회공헌','봉사','재직자','성인학습자','시민','지자체','공공','고령','중장년','소외','나눔','공동체','사회적','은퇴','전환교육','리스킬','업스킬']},
  {k:'mgmt', n:'재정·경영혁신',   kw:['재정','예산','수익','기금','모금','경영','성과관리','평가','인증','거버넌스','행정','효율','ESG','법인','등록금','재원','회계','규정','내부통제','홍보','브랜드','입학','마케팅','구조','지속가능']},
  {k:'org',  n:'구성원·조직문화', kw:['교원','직원','교직원','인사','역량','연수','조직','소통','복지','채용','문화','리더십','업무','근무','협업','처우']}

function uid(){return Math.random().toString(36).slice(2,9)}
function normUni(u){
  u.id=u.id||uid();u.name=u.name||'이름 없는 대학';u.values=u.values||[];u.goals=u.goals||[];u.tasks=(u.tasks||[]).map(t=>({title:t.title||'',goal:t.goal||'',domain:t.domain||''}));
  u.kpis=(u.kpis||[]).map(k=>({name:k.name||'',current:numOrNull(k.current),target:numOrNull(k.target),unit:k.unit||''}));
  u.start=numOrNull(u.start);u.end=numOrNull(u.end);u.budget=numOrNull(u.budget);u.planName=u.planName||'';u.vision=u.vision||'';u.notes=u.notes||'';
  return u}
function numOrNull(v){if(v===''||v==null)return null;const n=Number(String(v).replace(/[,\s%]/g,''));return isFinite(n)?n:null}
function load(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(d&&Array.isArray(d.unis)){S=Object.assign(S,d);S.unis=S.unis.map(normUni)}
  else S.unis=structuredClone(SAMPLE).map(normUni);
  if(!S.cmp||!S.cmp.length)S.cmp=S.unis.map(u=>u.id);
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>n==null?'–':(Math.round(n*10**d)/10**d).toLocaleString('ko-KR');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function classify(text){
  const s=String(text);let best=null,bs=0;
  for(const d of DOMAINS){let sc=0;for(const w of d.kw){if(/^[A-Za-z]/.test(w)?new RegExp(w.replace(/[-&]/g,'\\$&'),'i').test(s):s.includes(w))sc+=w.length>=3?1.5:1}
    if(sc>bs){bs=sc;best=d.k}}
  return best||'edu'}
const domOf=t=>t.domain||classify(t.title+' '+t.goal);
function kpiStd(name){const k=KPIS.find(k=>k.re.test(name));return k?k.n:null}
function homeUni(){return S.unis.find(u=>u.home)}
function cmpUnis(){return S.unis.filter(u=>S.cmp.includes(u.id))}
function domainShare(u){const c=Object.fromEntries(DOMAINS.map(d=>[d.k,0]));u.tasks.forEach(t=>c[domOf(t)]++);const n=u.tasks.length||1;
  return Object.fromEntries(DOMAINS.map(d=>[d.k,{n:c[d.k],p:c[d.k]/n*100}]))}
function tokens(text){
  return String(text).replace(/[·ㆍ\/,()「」『』\[\]<>〈〉“”"'‘’:;.!?~\-–—+&]/g,' ').split(/\s+/).map(w=>{
    w=w.trim();if(/^[A-Za-z]+$/.test(w))return w.toUpperCase();
    let p=w;for(let i=0;i<2;i++){if(p.length>2&&JOSA.test(p))p=p.replace(JOSA,'')}
    return p}).filter(w=>w&&w.length>=2&&!STOP.has(w)&&!/^\d/.test(w))}
function uniText(u){return [u.vision,u.values.join(' '),u.goals.join(' '),u.tasks.map(t=>t.title).join(' ')].join(' ')}
function kwCount(u){const m=new Map();tokens(uniText(u)).forEach(w=>m.set(w,(m.get(w)||0)+1));return m}
function heatClass(p){if(!p)return 'h0';return 'h'+Math.min(7,1+Math.floor(p/7.5))}

const tip=$('#tip');
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tip.hidden=true;return}
  const [v,...rest]=el.dataset.tip.split('|');tip.replaceChildren();const st=document.createElement('strong');st.textContent=v;tip.appendChild(st);
  rest.forEach(r=>{const s=document.createElement('span');s.textContent=r;tip.appendChild(s)});tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px'});

function download(blob,name){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(name+' 파일을 내려받았습니다.')}catch(e){toast('이 화면에서는 내려받기가 막혀 있습니다. 복사 버튼을 쓰세요.')}}
async function copyText(txt,label){try{await navigator.clipboard.writeText(txt);toast(label+' 복사했습니다. 엑셀에 붙여 넣으세요.')}catch(e){
  const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(label+' 복사했습니다.')}catch(_){toast('복사하지 못했습니다.')}ta.remove()}}

function cmpPicker(){return `<div class="row" role="group" aria-label="비교할 대학">${S.unis.map(u=>`<label class="chk"><input type="checkbox" data-cmp="${u.id}" ${S.cmp.includes(u.id)?'checked':''}> ${esc(u.name)}${u.home?' <span class="chip home">본교</span>':''}</label>`).join('')}</div>`}

function emptyState(){return `<div class="panel empty"><h3>비교할 대학이 없습니다</h3><p>엑셀 양식이나 계획서 원문으로 대학을 추가하세요.</p><div class="row"><a class="btn primary" href="#collect">자료 수합하기</a><a class="btn" href="#plans">직접 입력하기</a></div></div>`}

/* ── 종합 분석 ── */
function insights(us){
  const out=[];const home=us.find(u=>u.home);const others=us.filter(u=>!u.home);
  const share=new Map(us.map(u=>[u.id,domainShare(u)]));
  const avg=k=>others.length?others.reduce((a,u)=>a+share.get(u.id)[k].p,0)/others.length:0;
  // 공통 강조
  const common=DOMAINS.map(d=>({d,c:us.filter(u=>share.get(u.id)[d.k].p>=15).length})).filter(x=>x.c>=Math.max(2,Math.ceil(us.length*.6))).sort((a,b)=>b.c-a.c);
  if(common.length)out.push(`<b>공통 중점 영역:</b> ${common.map(x=>`${x.d.n}(${x.c}/${us.length}교)`).join(', ')} — 비교 대학 대부분이 전략과제의 15% 이상을 이 영역에 두고 있습니다.`);
  if(home&&others.length){
    const gaps=DOMAINS.map(d=>({d,g:share.get(home.id)[d.k].p-avg(d.k)})).sort((a,b)=>a.g-b.g);
    const weak=gaps.filter(x=>x.g<=-5).slice(0,2),strong=gaps.filter(x=>x.g>=5).reverse().slice(0,2);
    if(weak.length)out.push(`<b>본교 보완 검토 영역:</b> ${weak.map(x=>`${x.d.n}(타교 평균보다 ${fmt(-x.g)}%p 낮음)`).join(', ')}. 타교 과제를 <a href="#domains">영역 분석</a>에서 확인하세요.`);
    if(strong.length)out.push(`<b>본교 차별화 영역:</b> ${strong.map(x=>`${x.d.n}(+${fmt(x.g)}%p)`).join(', ')}.`);
    // KPI 목표 수준
    const hk=new Map(home.kpis.map(k=>[kpiStd(k.name)||k.name,k]));const lines=[];
    for(const std of KPIS){const h=hk.get(std.n);if(!h||h.target==null)continue;const os=others.map(u=>u.kpis.find(k=>(kpiStd(k.name)||k.name)===std.n)).filter(k=>k&&k.target!=null);if(!os.length)continue;
      const oa=os.reduce((a,k)=>a+k.target,0)/os.length;const better=std.up?h.target>=oa:h.target<=oa;
      if(!better)lines.push(`${std.n} 목표 ${fmt(h.target,2)}${std.unit} (타교 평균 ${fmt(oa,2)}${std.unit})`)}
    if(lines.length)out.push(`<b>타교보다 보수적인 성과목표:</b> ${lines.slice(0,3).join(' · ')}.`);
    if(home.budget!=null){const ob=others.filter(u=>u.budget!=null);if(ob.length){const oa=ob.reduce((a,u)=>a+u.budget,0)/ob.length;out.push(`<b>총 사업비:</b> 본교 ${fmt(home.budget,0)}억 원, 타교 평균 ${fmt(oa,0)}억 원 (${home.budget>=oa?'평균 이상':'평균의 '+fmt(home.budget/oa*100,0)+'%'}).`)}}
  } else if(!home){out.push('대학 하나를 <b>본교</b>로 지정하면 본교 대비 차이와 시사점이 함께 나옵니다. (<a href="#plans">대학별 계획</a>에서 지정)')}
  // 고유 키워드
  const kc=new Map(us.map(u=>[u.id,kwCount(u)]));const uniq=[];
  us.forEach(u=>{const words=[...kc.get(u.id)].filter(([w])=>us.filter(o=>o.id!==u.id).every(o=>!kc.get(o.id).has(w))).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);if(words.length)uniq.push(`${esc(u.name)}: ${words.join(', ')}`)});
  if(uniq.length)out.push(`<b>대학별 고유 키워드:</b> ${uniq.join(' / ')}`);
  return out}
function vOverview(){
  const us=cmpUnis();if(!S.unis.length)return emptyState();
  const tasks=us.reduce((a,u)=>a+u.tasks.length,0),kpis=us.reduce((a,u)=>a+u.kpis.length,0);
  const yrs=us.filter(u=>u.start&&u.end);const span=yrs.length?`${Math.min(...yrs.map(u=>u.start))}~${Math.max(...yrs.map(u=>u.end))}`:'–';
  return `<div class="page-head"><div><h2>종합 분석</h2><p>선택한 대학의 중장기발전계획을 영역 비중, 본교 대비 차이, 성과지표 기준으로 요약합니다.</p></div></div>
  ${sampleNote()}
  <div class="panel"><div class="panel-head"><h3>비교 대상</h3><p>체크를 풀면 모든 화면에서 빠집니다.</p></div>${cmpPicker()}</div>
  ${us.length?`<div class="tiles">
   <div class="tile"><span class="v">${us.length}<small class="muted" style="font-size:.9rem"> 교</small></span><span class="l">비교 대학</span></div>
   <div class="tile"><span class="v">${tasks}</span><span class="l">전략·추진과제 합계 (대학당 ${fmt(tasks/us.length)}개)</span></div>
   <div class="tile"><span class="v">${kpis}</span><span class="l">성과지표 합계</span></div>
   <div class="tile"><span class="v" style="font-size:1.3rem">${span}</span><span class="l">계획 기간 범위</span></div></div>
  <div class="panel"><div class="panel-head"><h3>주요 시사점</h3><p>입력된 과제·지표로 자동 작성합니다. 보고서 초안으로 다듬어 쓰세요.</p></div><ul class="insights">${insights(us).map(x=>`<li>${x}</li>`).join('')||'<li class="muted">과제가 더 입력되면 시사점이 나옵니다.</li>'}</ul></div>
  <div class="panel">${heatPanel(us)}</div>
  <div class="panel">${gapPanel(us)}</div>`:`<div class="panel empty">비교할 대학을 하나 이상 고르세요.</div>`}`}
function heatPanel(us){
  const cols=us.length;
  return `<div class="panel-head"><h3>영역별 과제 비중</h3><div class="legend"><span>0%</span><span class="ramp">${[0,1,2,3,4,5,6,7].map(i=>`<span class="h${i}"></span>`).join('')}</span><span>50%+</span></div></div>
  <div class="tbl-wrap" style="border:0"><div class="heat" style="grid-template-columns:128px repeat(${cols},minmax(64px,1fr))">
   <div></div>${us.map(u=>`<div class="hh" style="${u.home?'color:var(--home)':''}">${esc(u.name)}</div>`).join('')}
   ${DOMAINS.map(d=>`<div class="hr">${d.n}</div>${us.map(u=>{const s=domainShare(u)[d.k];return `<div class="hc ${heatClass(s.p)}" tabindex="0" data-tip="${fmt(s.p)}%|${esc(u.name)} · ${d.n}|과제 ${s.n}개 / 전체 ${u.tasks.length}개">${s.n?fmt(s.p,0)+'%':'–'}</div>`}).join('')}`).join('')}
  </div></div>
  <p class="small muted">각 칸 = 그 대학 전체 과제 중 해당 영역 과제의 비율. 영역은 과제명 키워드로 자동 분류되며 <a href="#plans">대학별 계획</a>에서 바꿀 수 있습니다.</p>`}
function gapPanel(us){
  const home=us.find(u=>u.home),others=us.filter(u=>!u.home);
  if(!home||!others.length)return `<div class="panel-head"><h3>본교 대비 비중 차이</h3></div><div class="empty">본교와 다른 대학이 모두 비교 대상에 있어야 보입니다.</div>`;
  const hs=domainShare(home);const rows=DOMAINS.map(d=>{const a=others.reduce((s,u)=>s+domainShare(u)[d.k].p,0)/others.length;return {d,g:hs[d.k].p-a,h:hs[d.k].p,a}});
  const mx=Math.max(10,...rows.map(r=>Math.abs(r.g)));const lim=Math.ceil(mx/5)*5;
  return `<div class="panel-head"><h3>본교 대비 비중 차이</h3><div class="legend"><span><i style="background:var(--pos)"></i>본교가 더 강조</span><span><i style="background:var(--neg)"></i>타교 평균이 더 강조</span></div></div>
  <div class="bars">${rows.map(r=>{const w=Math.abs(r.g)/lim*50;return `<div class="div-row"><span>${r.d.n}</span><div class="div-track" tabindex="0" data-tip="${r.g>=0?'+':''}${fmt(r.g)}%p|${r.d.n}|본교 ${fmt(r.h)}% · 타교 평균 ${fmt(r.a)}%"><span class="mid"></span>${Math.abs(r.g)>=.05?`<span class="b ${r.g>=0?'p':'n'}" style="${r.g>=0?`left:calc(50% + 1px)`:`right:calc(50% + 1px)`};width:${w}%"></span>`:''}</div><span class="v num">${r.g>=0?'+':''}${fmt(r.g)}</span></div>`}).join('')}</div>
  <div class="axis" style="grid-template-columns:130px minmax(0,1fr) 64px"><span></span><div class="ticks"><span style="left:0">−${lim}%p</span><span style="left:50%">0</span><span style="left:100%">+${lim}%p</span></div><span></span></div>
  <p class="small muted">${home.name==='본교'?'본교':'본교('+esc(home.name)+')'}의 영역 비중 − 비교 대학 ${others.length}교 평균 비중 (단위 %p)</p>`}

/* ── 대학별 계획 (입력·수정) ── */

  <div class="plans">
   <div class="list-uni">${S.unis.map(x=>`<button class="uni-item" data-act="selUni" data-id="${x.id}" aria-pressed="${x.id===S.selUni}"><span><b>${esc(x.name)}</b><br><span class="meta">${x.start||'?'}~${x.end||'?'} · 과제 ${x.tasks.length} · 지표 ${x.kpis.length}</span></span><span class="row" style="gap:4px">${x.home?'<span class="chip home">본교</span>':''}${x.sample?'<span class="chip ex">예시</span>':''}</span></button>`).join('')||'<p class="muted">아직 대학이 없습니다.</p>'}</div>
   ${u?editor(u):'<div class="panel empty">왼쪽에서 대학을 고르거나 추가하세요.</div>'}
  </div>`}

   <div class="form-grid">

    <label class="field w4"><span>비전</span><input type="text" id="f-vision" data-f="vision" value="${esc(u.vision)}"></label>
    <label class="field w2"><span>발전목표 (한 줄에 하나)</span><textarea id="f-goals" data-f="goals" rows="5">${esc(u.goals.join('\n'))}</textarea></label>
    <label class="field w2"><span>메모·출처</span><textarea id="f-notes" data-f="notes" rows="5">${esc(u.notes)}</textarea></label>
   </div>
   <div class="panel-head"><h3>전략·추진과제 <span class="muted small">${u.tasks.length}개</span></h3><button class="btn sm" data-act="addTask">과제 추가</button></div>
   <datalist id="goalList">${goalOpts}</datalist>
   <div class="tbl-wrap"><table class="edit"><thead><tr><th style="width:44%">과제명</th><th style="width:28%">발전목표</th><th>영역</th><th></th></tr></thead><tbody>
   ${u.tasks.map((t,i)=>`<tr><td><input type="text" id="t-title-${i}" data-t="${i}" data-k="title" value="${esc(t.title)}" aria-label="과제명"></td><td><input type="text" id="t-goal-${i}" list="goalList" data-t="${i}" data-k="goal" value="${esc(t.goal)}" aria-label="발전목표"></td>
    <td><select id="t-dom-${i}" data-t="${i}" data-k="domain" aria-label="영역"><option value="">자동: ${DOM[classify(t.title+' '+t.goal)].n}</option>${DOMAINS.map(d=>`<option value="${d.k}" ${t.domain===d.k?'selected':''}>${d.n}</option>`).join('')}</select></td>
    <td><button class="btn sm" data-act="delTask" data-i="${i}" aria-label="과제 삭제">✕</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">과제가 없습니다.</td></tr>'}
   </tbody></table></div>
   <div class="panel-head"><h3>성과지표 <span class="muted small">${u.kpis.length}개</span></h3><button class="btn sm" data-act="addKpi">지표 추가</button></div>

   ${u.kpis.map((k,i)=>`<tr><td><input type="text" id="k-name-${i}" list="kpiList" data-kp="${i}" data-k="name" value="${esc(k.name)}" aria-label="지표명"></td><td><input type="number" step="any" id="k-cur-${i}" data-kp="${i}" data-k="current" value="${k.current??''}" aria-label="현재값"></td><td><input type="number" step="any" id="k-tgt-${i}" data-kp="${i}" data-k="target" value="${k.target??''}" aria-label="목표값"></td><td><input type="text" id="k-unit-${i}" data-kp="${i}" data-k="unit" value="${esc(k.unit)}" style="width:64px" aria-label="단위"></td>

function curUni(){return S.unis.find(u=>u.id===S.selUni)}
document.addEventListener('input',e=>{const el=e.target;if(!el.closest||!el.closest('#editor'))return;const u=curUni();if(!u)return;u.sample=false;
  if(el.dataset.f&&el.dataset.f!=='home'){const f=el.dataset.f;const v=el.value;
    if(f==='values')u.values=v.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);else if(f==='goals'){u.goals=v.split('\n').map(s=>s.trim()).filter(Boolean);const dl=$('#goalList');if(dl)dl.innerHTML=u.goals.map(g=>`<option value="${esc(g)}">`).join('')}
    else if(['start','end','budget'].includes(f))u[f]=numOrNull(v);else u[f]=v;
    if(f==='name'){const b=document.querySelector(`.uni-item[data-id="${u.id}"] b`);if(b)b.textContent=v}}
  if(el.dataset.t!=null){u.tasks[+el.dataset.t][el.dataset.k]=el.value;if(el.dataset.k!=='domain'){const sel=$('#t-dom-'+el.dataset.t);if(sel)sel.options[0].textContent='자동: '+DOM[classify(u.tasks[+el.dataset.t].title+' '+u.tasks[+el.dataset.t].goal)].n}}
  if(el.dataset.kp!=null){const k=u.kpis[+el.dataset.kp];k[el.dataset.k]=['current','target'].includes(el.dataset.k)?numOrNull(el.value):el.value;
    if(el.dataset.k==='name'){const std=KPIS.find(x=>x.n===kpiStd(el.value));if(std&&!k.unit){k.unit=std.unit;const ui=$('#k-unit-'+el.dataset.kp);if(ui)ui.value=std.unit}}}
  save()});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.f==='home'){const u=curUni();S.unis.forEach(x=>x.home=false);u.home=el.checked;save();render()}

function kpiGroups(us){const m=new Map();us.forEach(u=>u.kpis.forEach(k=>{const n=kpiStd(k.name)||k.name.trim();if(!n)return;if(!m.has(n))m.set(n,[]);m.get(n).push({u,k})}));return m}
function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

  const mxRaw=Math.max(0,...rows.flatMap(r=>[r.k.current||0,r.k.target||0]));const mx=niceMax(mxRaw);const ticks=[0,.25,.5,.75,1].map(f=>f*mx);

  return `<div class="page-head"><div><h2>성과지표 비교</h2><p>같은 지표끼리 묶어 대학별 현재값과 목표값을 비교합니다. 지표명이 달라도 '충원율', '중도탈락' 같은 말로 묶습니다.</p></div></div>
  <div class="panel"><div class="panel-head"><h3>비교 대상</h3></div>${cmpPicker()}</div>
  ${names.length?`<div class="panel"><div class="panel-head"><label class="field" style="min-width:240px"><span>지표 고르기</span><select id="kpiSel">${names.map(n=>`<option ${n===S.kpiSel?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
   <div class="legend"><span><i style="background:var(--cur)"></i>현재값</span><span><i style="background:var(--tgt)"></i>목표값</span>${std?`<span>${std.up?'높을수록 좋음':'낮을수록 좋음'}</span>`:''}</div></div>
   <div class="bars">${rows.map(({u,k})=>{const inc=k.current!=null&&k.target!=null?k.target-k.current:null;return `<div class="bar-row"><span class="nm" style="${u.home?'color:var(--home)':''}" title="${esc(u.name)}">${esc(u.name)}</span>
    <div class="track">${ticks.slice(1).map(t=>`<span class="grid" style="left:${t/mx*100}%"></span>`).join('')}
     ${k.current!=null?`<span class="b cur" style="width:${k.current/mx*100}%" data-tip="${fmt(k.current,2)}${esc(k.unit||unit)}|${esc(u.name)} · 현재값|${esc(k.name)}"></span>`:''}
     ${k.target!=null?`<span class="b tgt" style="width:${k.target/mx*100}%" data-tip="${fmt(k.target,2)}${esc(k.unit||unit)}|${esc(u.name)} · 목표값|${inc!=null?'현재 대비 '+(inc>=0?'+':'')+fmt(inc,2):''}"></span>`:''}</div>
    <span class="vals">${fmt(k.current,2)} → <b>${fmt(k.target,2)}</b>${esc(k.unit||unit)}${inc!=null?`<br>${inc>=0?'+':''}${fmt(inc,2)}`:''}</span></div>`}).join('')}</div>
   <div class="axis"><span></span><div class="ticks">${ticks.map(t=>`<span style="left:${t/mx*100}%">${fmt(t,mx<10?1:0)}</span>`).join('')}</div><span class="muted">${esc(unit)}</span></div></div>

function setupDrop(dropId,inputId,fn){const d=$('#'+dropId),i=$('#'+inputId);if(!d)return;

  clearAll(b){if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='한 번 더 누르면 전부 지웁니다';setTimeout(()=>{b.dataset.arm='';b.textContent='모두 지우기'},3000);return}S.unis=[];S.cmp=[];save();render();toast('모든 자료를 지웠습니다.')},
  extractPaste(){const t=$('#pasteText').value;if(!t.trim()){toast('붙여 넣은 글이 없습니다.');return}runExtract(t,'붙여 넣은 글')},

};
function today(){return new Date().toISOString().slice(0,10)}

/* 엑셀 양식 */
function needX(){if(!window.XLSX){toast('엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');return false}return true}
function makeTemplate(ex){if(!needX())return;const wb=XLSX.utils.book_new();
  const base=[['항목','내용','작성 안내'],['대학명',ex?ex.name:'','예) ○○사이버대학교'],['계획명',ex?ex.planName:'',''],['시작연도',ex?ex.start:'','숫자 4자리'],['종료연도',ex?ex.end:'','숫자 4자리'],['비전',ex?ex.vision:'',''],['핵심가치',ex?ex.values.join(', '):'','쉼표로 구분'],['총사업비(억원)',ex?ex.budget:'','숫자만'],['출처·메모',ex?'예시 자료':'','계획서 이름, 발표 연도, 쪽수 등']];
  const ws1=XLSX.utils.aoa_to_sheet(base);ws1['!cols']=[{wch:16},{wch:50},{wch:30}];XLSX.utils.book_append_sheet(wb,ws1,'기본정보');
  const t=[['발전목표','전략·추진과제','영역(비우면 자동)'],...(ex?ex.tasks.map(x=>[x.goal,x.title,'']):[['','','']])];

  const k=[['지표명','현재값','목표값','단위','비고'],...(ex?ex.kpis.map(x=>[x.name,x.current,x.target,x.unit,'']):[['','','','','']])];
  const ws3=XLSX.utils.aoa_to_sheet(k);ws3['!cols']=[{wch:24},{wch:10},{wch:10},{wch:8},{wch:24}];XLSX.utils.book_append_sheet(wb,ws3,'성과지표');
  const ws4=XLSX.utils.aoa_to_sheet([['영역 이름(발전목표·과제 시트의 영역 칸에 그대로 적기)'],...DOMAINS.map(d=>[d.n]),[''],['비교 기준 지표명(같은 이름이면 대학끼리 비교됩니다)'],...KPIS.map(k=>[k.n+' ('+k.unit+')'])]);ws4['!cols']=[{wch:50}];XLSX.utils.book_append_sheet(wb,ws4,'참고');
  download(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),ex?'발전계획_수합양식_작성예시.xlsx':'발전계획_수합양식.xlsx')}
async function handleXlsx(files){if(!needX()||!files.length)return;let ok=0,bad=[];
  for(const f of files){try{const wb=XLSX.read(await f.arrayBuffer());const u=parseWorkbook(wb);if(!u){bad.push(f.name);continue}upsert(u);ok++}catch(e){bad.push(f.name)}}
  save();render();toast(`${ok}개 대학을 수합했습니다.`+(bad.length?` 읽지 못한 파일: ${bad.join(', ')}`:''))}
function sheetBy(wb,re){const n=wb.SheetNames.find(s=>re.test(s));return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}):null}
function parseWorkbook(wb){const b=sheetBy(wb,/기본/);if(!b)return null;const info={};b.forEach(r=>{if(r[0])info[String(r[0]).trim()]=r[1]});
  const g=(re)=>{const k=Object.keys(info).find(k=>re.test(k));return k?String(info[k]??'').trim():''};
  const u={name:g(/대학/),planName:g(/계획명/),start:g(/시작/),end:g(/종료/),vision:g(/비전/),values:g(/가치/).split(/[,，、]/).map(s=>s.trim()).filter(Boolean),budget:g(/사업비|예산/),notes:g(/출처|메모/),tasks:[],kpis:[]};
  if(!u.name)return null;
  const t=sheetBy(wb,/과제|목표/)||[];const goals=[];
  t.slice(1).forEach(r=>{const goal=String(r[0]||'').trim(),title=String(r[1]||'').trim(),dn=String(r[2]||'').trim();if(goal&&!goals.includes(goal))goals.push(goal);if(!title)return;
    const d=DOMAINS.find(d=>d.n===dn||d.n.replace(/·/g,'')===dn.replace(/[·ㆍ\s]/g,''));u.tasks.push({title,goal:goal||goals[goals.length-1]||'',domain:d?d.k:''})});
  u.goals=goals;
  const k=sheetBy(wb,/지표/)||[];k.slice(1).forEach(r=>{const n=String(r[0]||'').trim();if(n)u.kpis.push({name:n,current:r[1],target:r[2],unit:String(r[3]||'')})});
  return normUni(u)}
function upsert(u){const i=S.unis.findIndex(x=>x.name.replace(/\s/g,'')===u.name.replace(/\s/g,''));
  if(i>=0){u.id=S.unis[i].id;u.home=S.unis[i].home;S.unis[i]=u}else{S.unis.push(u);S.cmp.push(u.id)}}
function exportResult(){if(!needX())return;const us=cmpUnis();if(!us.length){toast('비교할 대학이 없습니다.');return}const wb=XLSX.utils.book_new();
  const rows=compareRows(us);const s1=XLSX.utils.aoa_to_sheet([['항목',...us.map(u=>u.name+(u.home?' (본교)':''))],...rows.map(r=>[r[0],...us.map(u=>r[2](u))])]);s1['!cols']=[{wch:16},...us.map(()=>({wch:40}))];XLSX.utils.book_append_sheet(wb,s1,'비교표');
  const s2=XLSX.utils.aoa_to_sheet([['영역',...us.map(u=>u.name+' 과제수'),...us.map(u=>u.name+' 비중(%)')],...DOMAINS.map(d=>[d.n,...us.map(u=>domainShare(u)[d.k].n),...us.map(u=>Math.round(domainShare(u)[d.k].p*10)/10)])]);XLSX.utils.book_append_sheet(wb,s2,'영역분포');
  const g=kpiGroups(us);const s3=XLSX.utils.aoa_to_sheet([['비교 지표','대학','원래 지표명','현재값','목표값','단위','증감'],...[...g].flatMap(([n,arr])=>arr.map(({u,k})=>[n,u.name,k.name,k.current,k.target,k.unit,k.current!=null&&k.target!=null?Math.round((k.target-k.current)*100)/100:'']))]);XLSX.utils.book_append_sheet(wb,s3,'성과지표');
  const s4=XLSX.utils.aoa_to_sheet([['대학','발전목표','과제','영역'],...us.flatMap(u=>u.tasks.map(t=>[u.name,t.goal,t.title,DOM[domOf(t)].n]))]);s4['!cols']=[{wch:16},{wch:28},{wch:46},{wch:16}];XLSX.utils.book_append_sheet(wb,s4,'과제목록');
  const s5=XLSX.utils.aoa_to_sheet([['주요 시사점 (자동 작성)'],...insights(us).map(x=>[x.replace(/<[^>]+>/g,'')])]);s5['!cols']=[{wch:120}];XLSX.utils.book_append_sheet(wb,s5,'시사점');
  download(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`발전계획_비교분석_${today()}.xlsx`)}

/* 원문 추출 */
async function handleDoc(files){const f=files[0];if(!f)return;toast(f.name+' 읽는 중…');
  try{let text='';const ext=f.name.split('.').pop().toLowerCase();
    if(ext==='pdf'){if(!window.pdfjsLib)throw new Error('PDF 도구를 불러오지 못했습니다.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      for(let p=1;p<=pdf.numPages;p++){const c=await (await pdf.getPage(p)).getTextContent();let line='',lastY=null;const lines=[];
        c.items.forEach(it=>{const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3){lines.push(line);line=''}line+=(line&&!line.endsWith(' ')&&it.str&&!it.str.startsWith(' ')&&it.hasEOL===false?'':'')+it.str;lastY=y;if(it.hasEOL){lines.push(line);line='';lastY=null}});
        if(line)lines.push(line);text+=lines.join('\n')+'\n'}}
    else if(ext==='docx'){if(!window.mammoth)throw new Error('Word 도구를 불러오지 못했습니다.');text=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
    else if(ext==='hwp'||ext==='hwpx'){throw new Error('한글 파일은 PDF로 저장한 뒤 올려 주세요.')}
    else text=await f.text();
    if(!text.trim())throw new Error('글자를 찾지 못했습니다. 스캔한 PDF는 글자가 없어 읽을 수 없습니다.');
    runExtract(text,f.name)}catch(e){toast(e.message||'파일을 읽지 못했습니다.')}}
function cleanLine(l){return l.replace(/^[\s　]*([0-9]{1,2}([\-.][0-9]{1,2})*[.)]?|[①-⑳]|[ⅰ-ⅹⅠ-Ⅹ]+\.?|[가-하][.)]|\([0-9가-하]{1,2}\)|[-•·▶▷□■○●◦◆◇※ㅇ∙❍]+)[\s　]*/,'').replace(/\s+/g,' ').trim()}
function runExtract(text,src){
  const raw=text.split(/\r?\n/).map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim());
  let vision='',name='',plan='',start=null,end=null;const goals=[],tasks=[],kpis=[],values=[];
  const y=text.match(/(20[2-4][0-9])\s*[~∼\-–]\s*(20[2-4][0-9])/);if(y){start=+y[1];end=+y[2]}
  const nm=text.match(/([가-힣A-Za-z]{2,12}(사이버대학교|사이버대학|디지털대학교|사이버대))/);if(nm)name=nm[1];
  let curGoal='';
  for(const l of raw){const c=cleanLine(l);if(c.length<4||c.length>90)continue;
    if(!vision&&/비전/.test(l)&&!/비전\s*체계/.test(l)){const v=c.replace(/^.*?비전\s*[:：]?\s*/,'');if(v.length>=6)vision=v.replace(/^["“'‘]|["”'’]$/g,'');continue}
    if(!values.length&&/핵심\s*가치/.test(l)){const v=c.replace(/^.*?핵심\s*가치\s*[:：]?\s*/,'');const p=v.split(/[,，、·ㆍ\/]/).map(s=>s.trim()).filter(s=>s&&s.length<=12);if(p.length>=2){values.push(...p);continue}}
    if(!plan&&/(VISION|비전|계획)\s*20[2-4][0-9]|발전계획/.test(l)&&c.length<=40&&!/^\d/.test(l.trim()))plan=c;
    // KPI: 지표 단어 + 숫자
    const nums=(c.match(/[0-9]+(?:\.[0-9]+)?/g)||[]).filter(n=>!/^20[2-4][0-9]$/.test(n)).map(Number);
    const unit=(c.match(/(%|점|명|과목|건|개|억)/)||[])[1]||'';
    if(nums.length&&(kpiStd(c)||/(률|율|도|수)\s*[:：]?\s*[0-9]/.test(c))){const nmK=c.replace(/[0-9.,]+\s*(%|점|명|과목|건|개|억 ?원?)?/g,'').replace(/[→\-~∼:：()（）]+/g,' ').replace(/\s+/g,' ').trim().slice(0,30);
      if(nmK.length>=2){kpis.push({name:kpiStd(c)||nmK,current:nums.length>1?nums[0]:null,target:nums[nums.length-1],unit,raw:c});continue}}
    const lvl1=/^[\s　]*([0-9]{1,2}[.)]|[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\.?|[①-⑳]|전략\s*[0-9]|목표\s*[0-9])\s*/.test(l)&&!/^[\s　]*[0-9]{1,2}[\-.][0-9]/.test(l);
    const lvl2=/^[\s　]*([0-9]{1,2}[\-.][0-9]{1,2}|[가-하][.)]|\([0-9가-하]{1,2}\)|[-•·▶▷□■○●◦ㅇ∙❍])/.test(l)||/^[\s　]{2,}/.test(l);
    if(/(목표|전략)/.test(l)&&lvl1||lvl1&&c.length<=30){goals.push(c);curGoal=c;continue}
    if(lvl2||lvl1)tasks.push({title:c,goal:curGoal,domain:''})}
  EXTRACT={src,name,plan,start,end,vision,values,goals:[...new Set(goals)].slice(0,15),tasks:tasks.slice(0,120),kpis:kpis.slice(0,40)};
  $('#extractBox').innerHTML=extractView();$('#extractBox').scrollIntoView({behavior:'smooth',block:'start'})}
function extractView(){const E=EXTRACT;const opts=S.unis.map(u=>`<option value="${u.id}" ${u.name===E.name?'selected':''}>${esc(u.name)}에 더하기</option>`).join('');
  return `<div class="panel"><div class="panel-head"><h3>추출 결과 확인 <span class="muted small">${esc(E.src)}</span></h3><p>빼야 할 줄은 체크를 푸세요. 저장한 뒤 대학별 계획에서 다듬을 수 있습니다.</p></div>
  <div class="form-grid">
   <label class="field w2"><span>대학명</span><input type="text" id="ex-name" value="${esc(E.name)}" placeholder="대학명을 적으세요"></label>
   <label class="field w2"><span>계획명</span><input type="text" id="ex-plan" value="${esc(E.plan)}"></label>
   <label class="field"><span>시작 연도</span><input type="number" id="ex-start" value="${E.start??''}"></label>
   <label class="field"><span>종료 연도</span><input type="number" id="ex-end" value="${E.end??''}"></label>
   <label class="field w2"><span>핵심가치</span><input type="text" id="ex-values" value="${esc(E.values.join(', '))}"></label>
   <label class="field w4"><span>비전</span><input type="text" id="ex-vision" value="${esc(E.vision)}"></label>
  </div>
  <div class="grid2">
   <div class="field"><div class="row" style="justify-content:space-between"><b>발전목표 후보 ${E.goals.length}</b><span class="row"><button class="btn sm" data-act="exAll" data-g="g" data-v="1">모두</button><button class="btn sm" data-act="exAll" data-g="g" data-v="0">해제</button></span></div>
    <div class="cand">${E.goals.map((g,i)=>`<label><input type="checkbox" data-g="g" data-i="${i}" checked> ${esc(g)}</label>`).join('')||'<span class="muted small">찾지 못했습니다</span>'}</div></div>
   <div class="field"><div class="row" style="justify-content:space-between"><b>성과지표 후보 ${E.kpis.length}</b><span class="row"><button class="btn sm" data-act="exAll" data-g="k" data-v="1">모두</button><button class="btn sm" data-act="exAll" data-g="k" data-v="0">해제</button></span></div>
    <div class="cand">${E.kpis.map((k,i)=>`<label><input type="checkbox" data-g="k" data-i="${i}" checked> <span>${esc(k.name)} <span class="muted num">${fmt(k.current,2)} → ${fmt(k.target,2)}${esc(k.unit)}</span><br><span class="muted small">${esc(k.raw)}</span></span></label>`).join('')||'<span class="muted small">찾지 못했습니다</span>'}</div></div>
  </div>
  <div class="field"><div class="row" style="justify-content:space-between"><b>전략·추진과제 후보 ${E.tasks.length}</b><span class="row"><button class="btn sm" data-act="exAll" data-g="t" data-v="1">모두</button><button class="btn sm" data-act="exAll" data-g="t" data-v="0">해제</button></span></div>
   <div class="cand">${E.tasks.map((t,i)=>`<label><input type="checkbox" data-g="t" data-i="${i}" checked> <span>${esc(t.title)}${t.goal?` <span class="muted small">· ${esc(t.goal)}</span>`:''}</span><span class="d">${DOM[classify(t.title+' '+t.goal)].n}</span></label>`).join('')||'<span class="muted small">찾지 못했습니다. 번호(1., 1-1., ○, - 등)로 시작하는 줄을 과제로 봅니다.</span>'}</div></div>
  <div class="row"><select id="ex-target" style="width:auto"><option value="new">새 대학으로 저장</option>${opts}</select><button class="btn primary" data-act="exSave">저장</button><button class="btn" data-act="exCancel">닫기</button></div></div>`}
function saveExtract(){const E=EXTRACT;const pick=g=>[...document.querySelectorAll(`#extractBox input[data-g="${g}"]:checked`)].map(c=>+c.dataset.i);
  const goals=pick('g').map(i=>E.goals[i]),tasks=pick('t').map(i=>E.tasks[i]),kpis=pick('k').map(i=>E.kpis[i]).map(({raw,...k})=>k);
  const tgt=$('#ex-target').value;const name=$('#ex-name').value.trim()||'이름 없는 대학';
  const vals=$('#ex-values').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
  if(tgt==='new'){const u=normUni({name,planName:$('#ex-plan').value,start:$('#ex-start').value,end:$('#ex-end').value,vision:$('#ex-vision').value,values:vals,goals,tasks,kpis,notes:'원문 추출: '+E.src});S.unis.push(u);S.cmp.push(u.id);S.selUni=u.id}
  else{const u=S.unis.find(x=>x.id===tgt);u.sample=false;u.goals=[...new Set([...u.goals,...goals])];u.tasks.push(...tasks);u.kpis.push(...normUni({kpis}).kpis);if(!u.vision)u.vision=$('#ex-vision').value;if(!u.values.length)u.values=vals;S.selUni=u.id}
  EXTRACT=null;save();toast(`${name}: 과제 ${tasks.length}개, 지표 ${kpis.length}개를 저장했습니다.`);location.hash='#plans';render()}
